server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Hashed build assets never change, so cache them forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Canonical URLs have no trailing slash: /services/fire/ -> /services/fire
    location ~ ^(.+)/$ {
        return 301 $1;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
