# Production stack. Built images come from GHCR (see .github/workflows/publish.yml),
# so the server only needs this file and a .env, not the source.
#
# Point your reverse proxy at:
#   example.com        -> http://<server-ip>:${SITE_PORT}
#   stats.example.com  -> http://<server-ip>:${UMAMI_PORT}

services:
  site:
    image: ghcr.io/samjwalsh/edsite:latest
    container_name: edsite
    restart: unless-stopped
    ports:
      - "${SITE_PORT:-8090}:8080"

  umami:
    image: ghcr.io/umami-software/umami:latest
    container_name: edsite-umami
    restart: unless-stopped
    init: true
    ports:
      - "${UMAMI_PORT:-8091}:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?set in .env}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set in .env}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_2FA_KEY:?set in .env}
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 5

  umami-db:
    image: postgres:17-alpine
    container_name: edsite-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set in .env}
    volumes:
      - ${UMAMI_DB_DIR:-./umami-db}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
